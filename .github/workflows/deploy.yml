name: Hugo 远程自动部署

on:
  push:
    branches:
      - main  # 推送到 main 就自动部署
  workflow_dispatch:  # 支持在 Actions 页面手动触发

# 同一分支只保留最新一次部署，避免并发冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.153.4'
          extended: true

      - name: 缓存 Hugo 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.ref }}-${{ hashFiles('hugo.toml', 'content/**', 'layouts/**', 'assets/**') }}
          restore-keys: |
            hugo-${{ github.ref }}-
            hugo-

      - name: 构建静态网站
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --gc --minify

      - name: 部署到 gh-pages（远程服务器完成）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true  # 强制覆盖，永远不冲突
