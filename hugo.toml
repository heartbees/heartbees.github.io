# 核心配置
baseURL = "https://heartbees.github.io/"
languageCode = "zh-cn"
title = "我的个人博客"
theme = "PaperMod"


# ================= 网站参数 =================
[params]

  author = "小香猪"
  description = "这是本菜鸟的个人博客"

  # PaperMod主题
  PaperModTheme = "light"

  # 开启评论功能（重要）
  comments = true

  # 文章导航
  ShowPostNavLinks = true

  # 显示归档按钮
  ShowArchiveButton = true

  # 首页文章
  ShowRecentPosts = true
  RecentPostsCount = 5

  # 首页图片
  images = ["/images/cover.jpg"]
  ShowHomeCover = true


  # ================= 首页信息 =================
  [params.homeInfoParams]

    Title = "我的个人博客"
    Content = "分享学习笔记与生活感悟"
    Image = "/images/cover.jpg"



# ================= 菜单 =================

[menu]

  [[menu.main]]

    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 1


  [[menu.main]]

    identifier = "posts"
    name = "博客"
    url = "/posts/"
    weight = 2



# ================= 文章链接 =================

[permalinks]

  posts = "/posts/:title/"



# ================= Markdown =================

[markup.goldmark.renderer]

  unsafe = true



[markup.highlight]

  style = "github"



# ================= Waline =================

[params.waline]

  enable = true

  serverURL = "https://jimlynn.vercel.app"

  pageview = true