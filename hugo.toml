baseURL = "https://heartbees.github.io/"
title = "Jimlynn"
theme = "PaperMod"

# 语言
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

# 生成 robots.txt（利于 SEO）
enableRobotsTXT = true

[params]

author = "小香猪"

description = "记录AI探索、技术学习与生活感悟"

defaultTheme = "auto"

# 评论
comments = true

# 文章功能
ShowPostNavLinks = true

ShowArchiveButton = true

ShowReadingTime = true

ShowWordCount = true

ShowBreadCrumbs = true

# 默认分享/OG 封面图
images = ["/images/cover.jpg"]

# 菜单
[menu]

[[menu.main]]

identifier = "about"

name = "关于"

url = "/about/"

weight = 1

[[menu.main]]

identifier = "posts"

name = "博客"

url = "/posts/"

weight = 2

# URL
[permalinks]

posts = "/posts/:title/"

# markdown
[markup.goldmark.renderer]

unsafe = true

[markup.highlight]

style = "github"

# 搜索（生成 index.json 供 PaperMod 搜索）
[outputs]

home = ["HTML", "RSS", "JSON"]

# Waline 评论
[params.waline]

enable = true

serverURL = "https://jimlynn.vercel.app"

pageview = true
