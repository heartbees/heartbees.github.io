{{- if .Site.Params.waline.enable -}}

<div id="waline"></div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.css">

<script type="module">

import { init } from 'https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.mjs';

init({

    el: '#waline',

    serverURL: '{{ .Site.Params.waline.serverURL }}',

    pageview: {{ .Site.Params.waline.pageview | default false }}

});

</script>

{{- end -}}
